name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Dar permiso de ejecución al wrapper
        run: chmod +x mvnw
      - name: Compilar y verificar (unitarios + IT con Testcontainers)
        run: ./mvnw verify
