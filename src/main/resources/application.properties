spring.application.name=apirest
server.port=8080

# API externa consumida para el catálogo de productos
dummyjson.base-url=https://dummyjson.com

# Springdoc / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# PostgreSQL (ver docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/apirest
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA: el esquema lo gestiona Flyway; Hibernate solo valida que coincida.
# Si dejás update o create, tenés dos herramientas compitiendo por el mismo esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false