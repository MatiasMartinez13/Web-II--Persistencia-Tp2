spring.application.name=${APP_NAME:apirest}
server.port=${PORT:8080}

# API externa consumida para el catálogo de productos
dummyjson.base-url=${DUMMYJSON_BASE_URL:https://dummyjson.com}

# Springdoc / OpenAPI
springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}

# PostgreSQL (ver docker-compose.yml) — sobrescribible por entorno (despliegue).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/apirest}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# JPA: el esquema lo gestiona Flyway; Hibernate solo valida que coincida.
# Si dejás update o create, tenés dos herramientas compitiendo por el mismo esquema.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

# JWT: secreto y expiración por entorno; defaults solo para desarrollo local.
app.jwt.secret=${JWT_SECRET:clave-local-solo-para-desarrollo-no-uso-en-produccion-1234567890}
app.jwt.expiration=${JWT_EXPIRATION:3600000}
